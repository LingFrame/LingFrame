name: CI

on:
  push:
    branches: [ main, master, develop, 'release/**' ]
  pull_request:
    branches: [ main, master, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # JDK 8 + Spring Boot 2.x：编译、测试、覆盖率
  # ──────────────────────────────────────────────
  build-and-test:
    name: Build & Test (SB2 / JDK 8)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'

      # 单条 verify reactor 自洽解析全部模块，无需 install 进 ~/.m2。
      # 默认 reuseForks=true（同一 forked JVM 顺序跑各测试类）即可：
      # starter 原先“共享 @Configuration 类被 CGLIB 二次增强”的 LinkageError 已在测试代码层通过
      # proxyBeanMethods=false 根因修复（见 LingTestSpringConfiguration），core 亦无需隔离 fork。
      # 示例级集成测试（ObservabilityClosedLoopIntegrationTest）已拆到独立 job example-it-sb2，
      # 本步骤只跑单元测试 + 质量门（verify 阶段的 checkstyle/spotbugs），与 SB3 拓扑对齐。
      # 不要用 -DargLine 覆盖内存参数：-D 用户属性优先级高于 POM 属性/profile，整体替换 argLine，
      # 会把 jdk9-plus-surefire 注入的 --add-opens 一并丢弃（SB3 在 JDK17 上反射 JDK 内部包会
      # 抛 InaccessibleObjectException）。内存调优已并入 lingframe-dependencies 的 argLine 属性。
      - name: Build & Test (SB2 / JDK 8)
        run: mvn -B -T 1C clean verify -Pspring-boot2

      # 覆盖率门控复用：把本步生成的 jacoco exec（位于 ${java.io.tmpdir}/jacoco/default/，见父 POM jacoco 配置）
      # 上传为 artifact，供 coverage-check-sb2 下载后直接 jacoco:check@check，避免 PR 上重跑全量测试。
      # SB2 主构建后无单模块 smoke 步骤，exec 保持完整，可安全在末尾上传。
      - name: Upload JaCoCo Exec Data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-exec-sb2
          path: /tmp/jacoco/default/
          retention-days: 14

      # 失败时打印 surefire dump 文件，暴露原始异常（NoClassDefFoundError 是 dump 路径的二次错误）
      - name: Print surefire dump on failure
        if: failure()
        run: |
          find . -name '*.dump*' -path '*/surefire-reports/*' -print -exec cat {} \; || true

      - name: Upload JaCoCo Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-sb2
          path: |
            **/target/site/jacoco/
          retention-days: 14

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-sb2
          path: '**/target/surefire-reports/'
          retention-days: 7

  # ──────────────────────────────────────────────
  # SB2 示例级 IT 冒烟（独立 job，失败不影响主构建矩阵结论时可后续收紧 needs）
  # 与 example-it-sb3 对齐：把示例 IT 从 build-and-test 内联拆出，隔离 flaky / 重的集成测试
  # ──────────────────────────────────────────────
  example-it-sb2:
    name: Example IT Smoke (SB2 / JDK 8)
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'

      - name: Observability closed-loop IT (SB2)
        run: >
          mvn -B -T 1C -pl lingframe-examples/lingframe-example-lingcore-app -am
          -Pspring-boot2,integration-check
          verify
          -Dit.test=ObservabilityClosedLoopIntegrationTest
          -Dsurefire.failIfNoSpecifiedTests=false

      - name: Upload IT Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: example-it-results-sb2
          path: '**/target/failsafe-reports/'
          retention-days: 7

  # ──────────────────────────────────────────────
  # JDK 17 + Spring Boot 3.x：编译、测试、覆盖率
  # ──────────────────────────────────────────────
  build-and-test-sb3:
    name: Build & Test (SB3 / JDK 17)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 用 install 而非 verify：把 reactor 产物（含公共 starter jar）装入本地仓库，
      # 供后续 SB3 gateway mapping smoke 的 -pl 单模块步骤解析依赖。
      # 默认 reuseForks=true 即可：SB3 starter 同属“共享 @Configuration 被 CGLIB 二次增强”问题，
      # 已随 proxyBeanMethods=false 根因修复一并消除，无需 reuseForks=false。
      - name: Build & Test (Spring Boot 3)
        run: mvn -B -T 1C clean install -Pspring-boot3

      # 覆盖率门控复用：上传 jacoco exec（${java.io.tmpdir}/jacoco/default/）供 coverage-check-sb3 复用。
      # 必须在下方 SB3 gateway mapping smoke 之前上传——该 smoke 是独立 mvn -pl 单模块 test，
      # 会以自己的运行覆盖 /tmp/jacoco/default/lingframe-spring-boot3-starter.exec，导致门控数据失真。
      - name: Upload JaCoCo Exec Data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-exec-sb3
          path: /tmp/jacoco/default/
          retention-days: 14

      # 双栈冒烟：显式再跑 SB3 网关映射单测，防止 AutoConfig 与映射类漂移被全量日志淹没
      # 依赖上一步 install 装入本地仓库的公共 starter jar；-pl 单模块无需 -am
      - name: SB3 gateway mapping smoke
        run: mvn -B -pl lingframe-runtime/lingframe-spring-boot3-starter test -Dtest=LingGatewayHandlerMappingTest -Pspring-boot3

      - name: Upload JaCoCo Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-sb3
          path: |
            **/target/site/jacoco/
          retention-days: 14

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-sb3
          path: '**/target/surefire-reports/'
          retention-days: 7

  # ──────────────────────────────────────────────
  # SB3 示例级 IT 冒烟（独立 job，失败不影响主构建矩阵结论时可后续收紧 needs）
  # ──────────────────────────────────────────────
  example-it-sb3:
    name: Example IT Smoke (SB3 / JDK 17)
    runs-on: ubuntu-latest
    needs: build-and-test-sb3
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Observability closed-loop IT (SB3)
        run: >
          mvn -B -T 1C -pl lingframe-examples/lingframe-example-lingcore-app -am
          -Pspring-boot3,integration-check
          verify
          -Dit.test=ObservabilityClosedLoopIntegrationTest
          -Dsurefire.failIfNoSpecifiedTests=false

      - name: Upload IT Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: example-it-results-sb3
          path: '**/target/failsafe-reports/'
          retention-days: 7

  # ──────────────────────────────────────────────
  # 覆盖率门控（PR 时对两个 JDK 版本分别检查）
  # ──────────────────────────────────────────────
  coverage-check-sb2:
    name: Coverage Gate (SB2 / JDK 8)
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'pull_request'
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'

      # 复用 build-and-test 已上传的 jacoco exec，直接做覆盖率门控，避免 PR 上重跑全量测试。
      # jacoco dataFile 由父 POM 定为 ${java.io.tmpdir}/jacoco/default/<artifactId>.exec，
      # 故下载回同一绝对路径即可被 jacoco:check@check 读取（无需重跑测试生成）。
      - name: Download JaCoCo Exec Data
        uses: actions/download-artifact@v4
        with:
          name: jacoco-exec-sb2
          path: /tmp/jacoco/default

      # 仅重编译（不跑测试）以恢复 target/classes 供 jacoco:check 比对覆盖率规则
      - name: Compile (no tests) for coverage analysis
        run: mvn -B -T 1C -pl lingframe-core,lingframe-dashboard,lingframe-runtime/lingframe-spring-boot-starter -am -Pspring-boot2 -DskipTests compile

      - name: Check Coverage Threshold
        run: |
          # @check 引用 pom 中 <id>check</id> 的 execution（带 rules/dataFile）；
          # 裸 `jacoco:check` 是 default-cli 调用，读不到 execution 的 rules → 报 missing/invalid
          mvn -B jacoco:check@check -pl lingframe-core,lingframe-dashboard,lingframe-runtime/lingframe-spring-boot-starter

  coverage-check-sb3:
    name: Coverage Gate (SB3 / JDK 17)
    runs-on: ubuntu-latest
    needs: build-and-test-sb3
    if: github.event_name == 'pull_request'
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 复用 build-and-test-sb3 已上传的 jacoco exec，直接做覆盖率门控，避免 PR 上重跑全量测试。
      - name: Download JaCoCo Exec Data
        uses: actions/download-artifact@v4
        with:
          name: jacoco-exec-sb3
          path: /tmp/jacoco/default

      - name: Compile (no tests) for coverage analysis
        run: mvn -B -T 1C -pl lingframe-core,lingframe-dashboard,lingframe-runtime/lingframe-spring-boot-starter -am -Pspring-boot3 -DskipTests compile

      - name: Check Coverage Threshold
        run: |
          # @check 引用 pom 中 <id>check</id> 的 execution（带 rules/dataFile）；
          # 裸 `jacoco:check` 是 default-cli 调用，读不到 execution 的 rules → 报 missing/invalid
          mvn -B jacoco:check@check -pl lingframe-core,lingframe-dashboard,lingframe-runtime/lingframe-spring-boot-starter

  # ──────────────────────────────────────────────
  # 性能基线：JDK 8 + JDK 17 双版本基准测试
  # ──────────────────────────────────────────────
  benchmark-jdk8:
    name: Performance Baseline (JDK 8)
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install dependencies
        run: mvn -B -T 1C install -DskipTests -pl lingframe-bom,lingframe-api,lingframe-core -am

      - name: Build & Run JMH Benchmarks
        run: |
          mvn -B -T 1C package -DskipTests -pl lingframe-benchmark -Pbenchmark -am
          java -jar lingframe-benchmark/target/lingframe-benchmarks.jar \
            -rf json -rff benchmark-results-jdk8.json \
            -wi 3 -i 5 -f 1

      - name: Upload Benchmark Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-jdk8
          path: benchmark-results-jdk8.json
          retention-days: 30

  benchmark-jdk17:
    name: Performance Baseline (JDK 17)
    runs-on: ubuntu-latest
    needs: build-and-test-sb3
    if: github.event_name == 'push'
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install dependencies
        run: mvn -B -T 1C install -DskipTests -pl lingframe-bom,lingframe-api,lingframe-core -am

      - name: Build & Run JMH Benchmarks
        run: |
          mvn -B -T 1C package -DskipTests -pl lingframe-benchmark -Pbenchmark -am
          java -jar lingframe-benchmark/target/lingframe-benchmarks.jar \
            -rf json -rff benchmark-results-jdk17.json \
            -wi 3 -i 5 -f 1

      - name: Upload Benchmark Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-jdk17
          path: benchmark-results-jdk17.json
          retention-days: 30
