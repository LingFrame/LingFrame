name: CI

on:
  push:
    branches: [ main, master, develop, 'release/**' ]
  pull_request:
    branches: [ main, master, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # JDK 8 + Spring Boot 2.x：编译、测试、覆盖率
  # ──────────────────────────────────────────────
  build-and-test:
    name: Build & Test (SB2 / JDK 8)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'

      # 显式带上 spring-boot2：只开 integration-check 会停用 activeByDefault 的 boot2 profile
      # JDK8 forked VM 跑完全部 core 测试后偶发 NoClassDefFoundError（surefire StringUtils）：
      # 原始异常通常是 OOM（surefire dump 机制在 OOM 后加载 StringUtils 又失败）。
      # 单 fork 复用 + 大量自定义 ClassLoader 累积。给 forked VM 加 heap 2g + Metaspace 1g 余量。
      # 仅 CI 注入，pom.xml 的 argLine 不动，本地构建不受影响。
      - name: Build & Test
        run: mvn -B clean verify -Pspring-boot2,integration-check -DargLine="-Djdk.net.URLClassPath.disableURLClassPathURLCheck=true -Xmx2g -XX:MaxMetaspaceSize=1g -XX:MetaspaceSize=256m"

      # 失败时打印 surefire dump 文件，暴露原始异常（NoClassDefFoundError 是 dump 路径的二次错误）
      - name: Print surefire dump on failure
        if: failure()
        run: |
          find . -name '*.dump*' -path '*/surefire-reports/*' -print -exec cat {} \; || true

      - name: Upload JaCoCo Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-sb2
          path: |
            **/target/site/jacoco/
          retention-days: 14

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-sb2
          path: '**/target/surefire-reports/'
          retention-days: 7

  # ──────────────────────────────────────────────
  # JDK 17 + Spring Boot 3.x：编译、测试、覆盖率
  # ──────────────────────────────────────────────
  build-and-test-sb3:
    name: Build & Test (SB3 / JDK 17)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 用 install 而非 verify：把 reactor 产物（含公共 starter jar）装入本地仓库，
      # 供后续 SB3 gateway mapping smoke 的 -pl 单模块步骤解析依赖
      - name: Build & Test (Spring Boot 3)
        run: mvn -B clean install -Pspring-boot3

      # 双栈冒烟：显式再跑 SB3 网关映射单测，防止 AutoConfig 与映射类漂移被全量日志淹没
      # 依赖上一步 install 装入本地仓库的公共 starter jar；-pl 单模块无需 -am
      - name: SB3 gateway mapping smoke
        run: mvn -B -pl lingframe-runtime/lingframe-spring-boot3-starter test -Dtest=LingGatewayHandlerMappingTest -Pspring-boot3

      - name: Upload JaCoCo Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-sb3
          path: |
            **/target/site/jacoco/
          retention-days: 14

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-sb3
          path: '**/target/surefire-reports/'
          retention-days: 7

  # ──────────────────────────────────────────────
  # SB3 示例级 IT 冒烟（独立 job，失败不影响主构建矩阵结论时可后续收紧 needs）
  # ──────────────────────────────────────────────
  example-it-sb3:
    name: Example IT Smoke (SB3 / JDK 17)
    runs-on: ubuntu-latest
    needs: build-and-test-sb3
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Observability closed-loop IT (SB3)
        run: >
          mvn -B -pl lingframe-examples/lingframe-example-lingcore-app -am
          -Pspring-boot3,integration-check
          verify
          -Dit.test=ObservabilityClosedLoopIntegrationTest
          -Dsurefire.failIfNoSpecifiedTests=false

      - name: Upload IT Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: example-it-results-sb3
          path: '**/target/failsafe-reports/'
          retention-days: 7

  # ──────────────────────────────────────────────
  # 覆盖率门控（PR 时对两个 JDK 版本分别检查）
  # ──────────────────────────────────────────────
  coverage-check-sb2:
    name: Coverage Gate (SB2 / JDK 8)
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'pull_request'
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'

      - name: Generate Coverage
        run: mvn -B clean verify -DargLine="-Djdk.net.URLClassPath.disableURLClassPathURLCheck=true -Xmx2g -XX:MaxMetaspaceSize=1g -XX:MetaspaceSize=256m"

      - name: Check Coverage Threshold
        run: |
          mvn -B jacoco:check -pl lingframe-core,lingframe-dashboard,lingframe-runtime/lingframe-spring-boot-starter

  coverage-check-sb3:
    name: Coverage Gate (SB3 / JDK 17)
    runs-on: ubuntu-latest
    needs: build-and-test-sb3
    if: github.event_name == 'pull_request'
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Generate Coverage
        run: mvn -B clean verify -Pspring-boot3

      - name: Check Coverage Threshold
        run: |
          mvn -B jacoco:check -pl lingframe-core,lingframe-dashboard,lingframe-runtime/lingframe-spring-boot-starter

  # ──────────────────────────────────────────────
  # 性能基线：JDK 8 + JDK 17 双版本基准测试
  # ──────────────────────────────────────────────
  benchmark-jdk8:
    name: Performance Baseline (JDK 8)
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install dependencies
        run: mvn -B install -DskipTests -pl lingframe-bom,lingframe-api,lingframe-core -am

      - name: Build & Run JMH Benchmarks
        run: |
          mvn -B package -DskipTests -pl lingframe-benchmark -Pbenchmark -am
          java -jar lingframe-benchmark/target/lingframe-benchmarks.jar \
            -rf json -rff benchmark-results-jdk8.json \
            -wi 3 -i 5 -f 1

      - name: Upload Benchmark Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-jdk8
          path: benchmark-results-jdk8.json
          retention-days: 30

  benchmark-jdk17:
    name: Performance Baseline (JDK 17)
    runs-on: ubuntu-latest
    needs: build-and-test-sb3
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install dependencies
        run: mvn -B install -DskipTests -pl lingframe-bom,lingframe-api,lingframe-core -am

      - name: Build & Run JMH Benchmarks
        run: |
          mvn -B package -DskipTests -pl lingframe-benchmark -Pbenchmark -am
          java -jar lingframe-benchmark/target/lingframe-benchmarks.jar \
            -rf json -rff benchmark-results-jdk17.json \
            -wi 3 -i 5 -f 1

      - name: Upload Benchmark Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-jdk17
          path: benchmark-results-jdk17.json
          retention-days: 30

  # ──────────────────────────────────────────────
  # 依赖漏洞扫描（OWASP Dependency Check）
  # ──────────────────────────────────────────────
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run OWASP Dependency Check
        run: mvn -B org.owasp:dependency-check-maven:check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Upload Dependency Check Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: '**/target/dependency-check-report.*'
          retention-days: 30
