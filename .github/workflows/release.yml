name: Release and Metadata Sync

on:
  workflow_run:
    workflows: [Main Smoke]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      versions:
        description: '要同步的版本，支持逗号或换行分隔，例如 0.4.5,0.4.6,0.4.7'
        required: true
        type: string
      platform:
        description: '要同步的平台'
        required: true
        type: choice
        options:
          - all
          - gitee
          - gitcode

permissions:
  contents: read

concurrency:
  group: lingframe-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.repository == 'LingFrame/LingFrame' &&
      (
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
      release_branch: ${{ steps.prepare.outputs.release_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check release intent and extract changelog
        id: prepare
        env:
          RELEASE_VERSION: ''
        run: python3 scripts/release/prepare.py
      - name: Create immutable release
        if: steps.prepare.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.prepare.outputs.tag }}
          RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            test "$(git rev-list -n 1 "$TAG")" = "$RELEASE_SHA" || {
              echo 'Release tag points to another commit'; exit 1;
            }
          else
            gh api "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$RELEASE_SHA"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Release already exists; preserving its notes and assets.'
          else
            gh release create "$TAG" --verify-tag --title "灵珑·${{ steps.prepare.outputs.codename }}-$TAG" --generate-notes --notes-file release-notes.md
          fi

      - name: Create or advance stable release branch
        if: steps.prepare.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          RELEASE_BRANCH: ${{ steps.prepare.outputs.release_branch }}
        shell: bash
        run: |
          set -euo pipefail
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" \
            "${RELEASE_SHA}:refs/heads/${RELEASE_BRANCH}"

  release-metadata:
    needs: release
    if: >-
      always() &&
      (
        (
          github.event_name == 'workflow_run' &&
          needs.release.result == 'success' &&
          needs.release.outputs.tag != ''
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          github.ref_name == 'main' &&
          inputs.versions != ''
        )
      ) &&
      (
        github.event_name == 'workflow_run' ||
        github.event_name == 'workflow_dispatch'
      )
    strategy:
      fail-fast: false
      matrix:
        platform: [gitee, gitcode]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: mirrors
    steps:
      - name: Synchronize Release metadata
        if: >-
          github.event_name == 'workflow_run' ||
          inputs.platform == 'all' ||
          inputs.platform == matrix.platform
        env:
          RELEASE_VERSIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.versions || needs.release.outputs.tag }}
          PLATFORM: ${{ matrix.platform }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          case "$PLATFORM" in
            gitee|gitcode) platforms="$PLATFORM" ;;
            *) echo "Unsupported platform: $PLATFORM"; exit 1 ;;
          esac

          for version in $(printf '%s' "$RELEASE_VERSIONS" | tr ',\r\n' '   '); do
            [ -n "$version" ] || continue
            tag="V${version#V}"
            release_json=$(mktemp)
            trap 'rm -f "$release_json"' EXIT
            gh api "repos/$GH_REPO/releases/tags/$tag" > "$release_json"
            release_name=$(jq -r '.name' "$release_json")
            release_body=$(jq -r '.body // ""' "$release_json")
            target_commitish=$(jq -r '.target_commitish // ""' "$release_json")
            test -n "$release_name"

            for platform in $platforms; do
              case "$platform" in
                gitee)
                  test -n "$GITEE_TOKEN"
                  api_base='https://gitee.com/api/v5/repos/LingFrame/LingFrame/releases'
                  token="$GITEE_TOKEN"
                  payload=$(jq -n --arg tag "$tag" --arg name "$release_name" --arg body "$release_body" --arg target "$target_commitish" \
                    '{tag_name:$tag,name:$name,body:$body,target_commitish:$target}')
                  ;;
                gitcode)
                  test -n "$GITCODE_TOKEN"
                  api_base='https://api.gitcode.com/api/v5/repos/lingframe/LingFrame/releases'
                  token="$GITCODE_TOKEN"
                  payload=$(jq -n --arg tag "$tag" --arg name "$release_name" --arg body "$release_body" --arg target "$target_commitish" \
                    '{tag_name:$tag,name:$name,body:$body,target_commitish:$target,release_status:"latest"}')
                  ;;
              esac
              get_url="$api_base?access_token=$token&page=1&per_page=100"
              create_url="$api_base?access_token=$token"
              response_file=$(mktemp)
              trap 'rm -f "$release_json" "$response_file"' EXIT
              status=$(curl -sS -o "$response_file" -w '%{http_code}' \
                -H 'Accept: application/json' \
                -H "Authorization: Bearer $token" \
                "$get_url")
              case "$status" in
                200)
                  remote_id=$(jq -r --arg tag "$tag" 'if type == "array" then (map(select((.tag_name // "") | ascii_downcase == ($tag | ascii_downcase))) | first | .id // empty) else empty end' "$response_file")
                  remote_tag=$(jq -r --arg tag "$tag" 'if type == "array" then (map(select((.tag_name // "") | ascii_downcase == ($tag | ascii_downcase))) | first | .tag_name // empty) else empty end' "$response_file")
                  remote_url=$(jq -r --arg tag "$tag" 'if type == "array" then (map(select((.tag_name // "") | ascii_downcase == ($tag | ascii_downcase))) | first | (.html_url // .web_url // empty)) else empty end' "$response_file")
                  remote_target=$(jq -r --arg tag "$tag" 'if type == "array" then (map(select((.tag_name // "") | ascii_downcase == ($tag | ascii_downcase))) | first | (.target_commitish // empty)) else empty end' "$response_file")
                  if [ -z "$remote_id" ] && jq -e 'type == "array"' "$response_file" >/dev/null; then
                    echo "$platform returned no Release for $tag; creating it."
                    create_response=$(mktemp)
                    create_status=$(curl -sS -o "$create_response" -w '%{http_code}' -X POST "$create_url" \
                      -H 'Accept: application/json' \
                      -H 'Content-Type: application/json' \
                      -H "Authorization: Bearer $token" \
                      --data "$payload")
                    if [ "$create_status" != 201 ] && [ "$create_status" != 200 ]; then
                      if [ "$create_status" = 409 ]; then
                        echo "$platform reported $tag already exists; re-reading by tag variants."
                        for lookup_tag in "$tag" "v${tag#V}"; do
                          lookup_response=$(mktemp)
                          lookup_status=$(curl -sS -o "$lookup_response" -w '%{http_code}' \
                            -H 'Accept: application/json' \
                            -H "Authorization: Bearer $token" \
                            "$api_base/tags/$lookup_tag?access_token=$token")
                          if [ "$lookup_status" = 200 ]; then
                            remote_id=$(jq -r '.id // empty' "$lookup_response")
                            remote_tag=$(jq -r '.tag_name // empty' "$lookup_response")
                            remote_url=$(jq -r '.html_url // .web_url // empty' "$lookup_response")
                            remote_target=$(jq -r '.target_commitish // empty' "$lookup_response")
                            rm -f "$lookup_response"
                            [ -n "$remote_id" ] && break
                          fi
                          rm -f "$lookup_response"
                        done
                        rm -f "$create_response"
                        if [ -n "${remote_id:-}" ] && [ -n "${remote_tag:-}" ]; then
                          if [[ "$target_commitish" =~ ^[0-9a-fA-F]{40}$ ]] && [ "$remote_target" = "$target_commitish" ]; then
                            echo "$platform Release $remote_tag already points to $target_commitish; skipping."
                            continue
                          fi
                          update_url="$api_base/$remote_id?access_token=$token"
                          update_payload=$(jq --arg tag "$remote_tag" '.tag_name = $tag' <<< "$payload")
                          curl --fail-with-body -sS -X PATCH "$update_url" \
                            -H 'Accept: application/json' \
                            -H 'Content-Type: application/json' \
                            -H "Authorization: Bearer $token" \
                            --data "$update_payload"
                          continue
                        fi
                      fi
                      cat "$create_response"
                      rm -f "$create_response"
                      exit 1
                    fi
                    cat "$create_response"
                    rm -f "$create_response"
                    continue
                  fi
                  if [ -z "$remote_id" ] || [ "${remote_tag,,}" != "${tag,,}" ]; then
                    echo "$platform returned an invalid Release list for $tag; expected an array of Releases."
                    jq -c 'if type == "array" then {type:"array",count:length} else {type:(type),keys:(keys)} end' "$response_file"
                    exit 1
                  fi
                  if [[ "$target_commitish" =~ ^[0-9a-fA-F]{40}$ ]] && [ "$remote_target" = "$target_commitish" ]; then
                    echo "$platform Release $remote_tag already points to $target_commitish; skipping."
                    continue
                  fi
                  echo "$platform Release $tag found (id=$remote_id${remote_url:+, url=$remote_url}); updating metadata."
                  update_url="$api_base/$remote_id?access_token=$token"
                  update_payload=$(jq --arg tag "$remote_tag" '.tag_name = $tag' <<< "$payload")
                  curl --fail-with-body -sS -X PATCH "$update_url" \
                    -H 'Accept: application/json' \
                    -H 'Content-Type: application/json' \
                    -H "Authorization: Bearer $token" \
                    --data "$update_payload"
                  ;;
                404)
                  echo "$platform Release $tag was not found; creating it."
                  curl --fail-with-body -sS -X POST "$create_url" \
                    -H 'Accept: application/json' \
                    -H 'Content-Type: application/json' \
                    -H "Authorization: Bearer $token" \
                    --data "$payload"
                  ;;
                *)
                  echo "Unable to inspect $platform Release $tag (HTTP $status)"
                  exit 1
                  ;;
              esac
            done
          done
