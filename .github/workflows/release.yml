name: Release and Metadata Sync

on:
  workflow_run:
    workflows: [Main Smoke]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: '明确指定要重新发布的现有稳定版本（仅用于恢复发布物）'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: lingframe-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.repository == 'LingFrame/LingFrame' &&
      (
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          github.ref_name == 'main' &&
          inputs.version != ''
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
      release_branch: ${{ steps.prepare.outputs.release_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check release intent and extract changelog
        id: prepare
        env:
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
        run: python3 scripts/release/prepare.py
      - name: Create immutable release
        if: steps.prepare.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.prepare.outputs.tag }}
          RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            test "$(git rev-list -n 1 "$TAG")" = "$RELEASE_SHA" || {
              echo 'Release tag points to another commit'; exit 1;
            }
          else
            gh api "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$RELEASE_SHA"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Release already exists; preserving its notes and assets.'
          else
            gh release create "$TAG" --verify-tag --title "灵珑·${{ steps.prepare.outputs.codename }}-$TAG" --generate-notes --notes-file release-notes.md
          fi

      - name: Create or advance stable release branch
        if: steps.prepare.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          RELEASE_BRANCH: ${{ steps.prepare.outputs.release_branch }}
        shell: bash
        run: |
          set -euo pipefail
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" \
            "${RELEASE_SHA}:refs/heads/${RELEASE_BRANCH}"

  release-metadata:
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: mirrors
    strategy:
      fail-fast: false
      matrix:
        platform: [gitee, gitcode]
    steps:
      - name: Synchronize Release metadata
        env:
          PLATFORM: ${{ matrix.platform }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          release_json=$(mktemp)
          trap 'rm -f "$release_json"' EXIT
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > "$release_json"
          release_name=$(jq -r '.name' "$release_json")
          release_body=$(jq -r '.body // ""' "$release_json")
          target_commitish=$(jq -r '.target_commitish // ""' "$release_json")
          test -n "$release_name"
          case "$PLATFORM" in
            gitee)
              test -n "$GITEE_TOKEN"
              api_base='https://gitee.com/api/v5/repos/LingFrame/LingFrame/releases'
              get_url="$api_base/tags/$RELEASE_TAG?access_token=$GITEE_TOKEN"
              create_url="$api_base?access_token=$GITEE_TOKEN"
              payload=$(jq -n --arg tag "$RELEASE_TAG" --arg name "$release_name" --arg body "$release_body" --arg target "$target_commitish" \
                '{tag_name:$tag,name:$name,body:$body,target_commitish:$target}')
              ;;
            gitcode)
              test -n "$GITCODE_TOKEN"
              api_base='https://api.gitcode.com/api/v5/repos/lingframe/LingFrame/releases'
              get_url="$api_base/tags/$RELEASE_TAG?access_token=$GITCODE_TOKEN"
              create_url="$api_base?access_token=$GITCODE_TOKEN"
              payload=$(jq -n --arg tag "$RELEASE_TAG" --arg name "$release_name" --arg body "$release_body" --arg target "$target_commitish" \
                '{tag_name:$tag,name:$name,body:$body,target_commitish:$target,release_status:"latest"}')
              ;;
            *) echo "Unsupported platform: $PLATFORM"; exit 1 ;;
          esac
          status=$(curl -sS -o /dev/null -w '%{http_code}' "$get_url")
          case "$status" in
            200)
              echo "$PLATFORM Release $RELEASE_TAG already exists; skipping creation."
              ;;
            404)
              curl --fail-with-body -sS -X POST "$create_url" \
                -H 'Content-Type: application/json' \
                --data "$payload"
              ;;
            *)
              echo "Unable to inspect $PLATFORM Release $RELEASE_TAG (HTTP $status)"
              exit 1
              ;;
          esac
