server:
  port: 8083

spring:
  mvc:
    path match:
      matching-strategy: ant_path_matcher
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:lingmall_saas;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  cache:
    type: simple

mybatis-plus:
  configuration:
    map-underline-to-camel-case: true
  global-config:
    db-config:
      table-underline: true

jwt:
  secret: d29uZGVyZnVsLWxpbmctdGVzdC1tYWxsLXNlY3JldC1kZW1vLWtleS1mb3Itand0LXNpZ25pbmctcHJvZHVjdGlvbg==
  expiration: 86400

lingframe:
  enabled: true
  dev-mode: true
  ling-home: lings
  preload-api-jars:
    - ../lingframe-example-saas-api
  ling-roots:
    - ../lingframe-example-saas-ling-oauth
    - ../lingframe-example-saas-ling-seckill
    - ../lingframe-example-saas-ling-refund
  ling-core-governance:
    enabled: false
    govern-internal-calls: true
    check-permissions: true
  dashboard:
    enabled: true
    install-enabled: true
    # SQLite 持久化存储
    storage:
      enabled: true
      path: ${user.home}/.lingframe/mall-dashboard.db
      metrics-retention-days: 7
      audit-retention-days: 30
      metrics-collect-interval-seconds: 30
    # 访问令牌：示例本地允许弱口令；生产请设强 token 且 allow-weak: false
    access-token:
      enabled: true
      token: "123456"
      allow-weak: true

# SpringDoc OpenAPI 配置
springdoc:
  cache:
    disabled: true
  packages-to-scan: com.lingframe
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
