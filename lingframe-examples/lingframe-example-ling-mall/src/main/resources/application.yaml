server:
  port: 8082

spring:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:lingmall;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  cache:
    type: simple

mybatis-plus:
  configuration:
    map-underline-to-camel-case: true
  global-config:
    db-config:
      table-underline: true

# 自定义 JWT 配置
jwt:
  # 密钥 Base64 格式，用于生成 Token 签名
  secret: d29uZGVyZnVsLWxpbmctdGVzdC1tYWxsLXNlY3JldC1kZW1vLWtleS1mb3Itand0LXNpZ25pbmctcHJvZHVjdGlvbg==
  # 过期时间：1天 (86400秒)
  expiration: 86400

# SpringDoc OpenAPI 配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
