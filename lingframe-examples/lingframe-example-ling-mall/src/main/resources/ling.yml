# --- 基础元数据 (直接在根节点) ---
# 本文件是「老单体最小化改造为灵元」的范例——仅添加此元数据即完成改造。
id: mall-ling
version: 1.0.0
provider: "LingFrame"
description: "商城单体灵元"
mainClass: "com.lingframe.example.mall.MallApplication"

# --- 治理配置 ---
governance:
    permissions: []
    capabilities:
      - capability: "storage:sql"
        accessType: "WRITE"
      - capability: "cache:local"
        accessType: "WRITE"

properties:
  mark: "mall"
