server:
  port: 8888

spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB
  # 修复 Spring Boot 2.6+ 与 SpringDoc 1.x 的兼容性问题
  # 避免 "Expected lookupPath in request attribute" 错误
  mvc:
    path match:
      matching-strategy: ant_path_matcher
  web:
    resources:
      cache:
        period: 0
      chain:
        cache: false
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    open-in-view: false
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:lingframe;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:

  # 演示用：使用简单的 ConcurrentMapCacheManager
  cache:
    type: simple

lingframe:
  enabled: true
  dev-mode: true
  preload-api-jars:
    - ../lingframe-example-order-api
    - lingframe-examples/lingframe-example-order-api
  ling-home: lings
  ling-roots:
    - ../lingframe-example-ling-order
    - ../lingframe-example-ling-user
    - ../lingframe-example-ling-user-canary
    - lingframe-examples/lingframe-example-ling-order
    - lingframe-examples/lingframe-example-ling-user
    - lingframe-examples/lingframe-example-ling-user-canary
  ling-core-governance:
    enabled: false
    govern-internal-calls: true
    check-permissions: true
  # 开启 Dashboard 功能
  dashboard:
    enabled: true
    install-enabled: true
    # SQLite 持久化存储
    storage:
      enabled: true
      path: ${user.home}/.lingframe/dashboard.db
      metrics-retention-days: 7
      audit-retention-days: 30
      metrics-collect-interval-seconds: 30
    # 访问令牌（生产环境建议设置，留空则不启用）
    access-token:
      enabled: false
      token: ""

# SpringDoc OpenAPI 配置
springdoc:
  # 禁用 SpringDoc 缓存以支持灵元动态加载
  cache:
    disabled: true
  packages-to-scan: com.lingframe
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  group-configs:
    - group: 00-all
      display-name: 00. All APIs
      paths-to-match: /**
    - group: 01-core
      display-name: 01. Core (Dashboard)
      paths-to-match: /**/dashboard/**
    - group: 02-LINGCORE
      display-name: 02. LINGCORE Application
      paths-to-exclude: /**/dashboard/**, /*-ling/**
    - group: 03-Lings
      display-name: 03. Lings
      paths-to-match: /**-ling/**

logging:
  level:
    com.lingframe: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: true
    prometheus:
      enabled: true
